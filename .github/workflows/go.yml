# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Go-version policy: stay decoupled from any specific Go toolchain.
#   - go.mod carries a *minimum* language version (`go 1.26.0`), never a `toolchain`
#     pin. `setup-go` with `go-version-file` resolves that to the newest Go that
#     satisfies the floor, so the build tracks the current toolchain instead of a
#     locked point release.
#   - golangci-lint is installed *from source* (`go install`), which compiles it
#     against the active toolchain. A prebuilt golangci-lint binary has a baked-in
#     "max Go version it can target"; installing from source removes that ceiling,
#     so the linter can never be older than the toolchain it runs on again.

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install golangci-lint (source build, matches active toolchain)
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: Run golangci-lint
        run: golangci-lint run ./...

  test:
    name: Test and collect coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/cache@v3
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run tests and collect coverage
        run: make test-coverage

      - name: Run leakcheck self-check
        run: make self-check

      - name: Upload coverage results to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
